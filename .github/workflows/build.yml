name: Build New-API with Xunhupay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build default frontend
        run: |
          cd web/default
          npm install --legacy-peer-deps
          npm run build

      - name: Build classic frontend
        run: |
          cd web/classic
          npm install --legacy-peer-deps
          npm run build

      - name: Build Windows binary
        run: |
          go mod download
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o new-api.exe main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-api-windows
          path: |
            new-api.exe
            .env.example
            README.md
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: new-api.exe
          body: |
            Auto-built Windows binary with Xunhupay (虎皮椒) payment support.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
